<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas responsive preview</title>
<style>body{margin:0;background:#d8dfe2;color:#142b38;font:16px system-ui}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#142b38;color:white}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:6px}main{padding:12px;overflow:auto}iframe{display:block;border:0;margin:auto;background:white;height:1000px;box-shadow:0 3px 12px #142b3830}p{margin:0;font-size:13px}strong{font-size:17px}</style></head>
<body><header><strong>Atlas responsive check</strong><label>Screen<select id="screen"><option value="index.html?year=868&civ=abbasid">World Map</option><option value="compare.html?year=868&civ=abbasid">Compare</option><option value="index.html?year=868&civ=abbasid#technology">Technology</option><option value="story.html?year=868">Story</option><option value="conflicts.html">Conflicts</option></select></label><label>Width<select id="width"><option value="1440">1440 px</option><option value="1024">1024 px</option><option value="768">768 px</option><option value="390">390 px</option><option value="320">320 px</option></select></label><p>Development preview only. Same application assets in a constrained viewport.</p></header><main><iframe id="preview" title="Atlas screen preview" width="1440" src="index.html?year=868&civ=abbasid"></iframe></main>
<script>const screen=document.getElementById('screen'),width=document.getElementById('width'),preview=document.getElementById('preview');screen.addEventListener('change',()=>preview.src=screen.value);width.addEventListener('change',()=>{preview.width=width.value;preview.style.height=Number(width.value)<700?'844px':'1000px';});</script></body></html>
