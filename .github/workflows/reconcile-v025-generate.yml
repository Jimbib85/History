name: Regenerate v0.25 research identity crosswalk
on:
  push:
    branches:
      - feat/v025-evidence-identity-review
    paths:
      - 'scripts/build-modern-v2-reconciliation.mjs'
      - '.github/workflows/reconcile-v025-generate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/build-modern-v2-reconciliation.mjs --print
          node scripts/build-modern-v2-reconciliation.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modern-v2-reconciled-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild v0.25 explicitly reviewed identity crosswalk"
            git push origin HEAD:feat/v025-evidence-identity-review
          fi
