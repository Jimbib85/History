name: Development source snapshot
on:
  push:
    branches: ['feat/v022-research-maps-compare']
    paths: ['.github/workflows/workspace-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/atlas-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-source-snapshot
          path: /tmp/atlas-source.tar
          retention-days: 1
