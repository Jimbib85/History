name: Atlas regression tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  unit-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate history data and interactions
        run: npm test
